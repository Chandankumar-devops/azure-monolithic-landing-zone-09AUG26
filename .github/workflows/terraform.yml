name: Terraform Pre-Prod Plan

on:
  push:
    branches:
      - feature/branch

  pull_request:
    branches:
      - feature/branch

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  TF_WORKING_DIR: Enviornment_Module/Enviornment/Pre_Prod
  ARM_USE_OIDC: true
  ARM_CLIENT_ID: "15663cb6-30cd-4037-b34b-f9de8146f137"
  ARM_TENANT_ID: "e8d592ab-f2df-4543-882e-e0e0db835e04"
  ARM_SUBSCRIPTION_ID: "370b2d3a-e01b-4f6f-8d7c-760f75894068"

jobs:
  terraform-plan:
    name: Terraform Plan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: "15663cb6-30cd-4037-b34b-f9de8146f137"
          tenant-id: "e8d592ab-f2df-4543-882e-e0e0db835e04"
          subscription-id: "370b2d3a-e01b-4f6f-8d7c-760f75894068"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform init

      - name: Terraform Format Check
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform validate

      - name: Terraform Plan
        working-directory: ${{ env.TF_WORKING_DIR }}
        run: terraform plan